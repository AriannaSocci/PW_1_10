spring:
  application:
    name: data_generator

  # Database H2 Configuration
  datasource:
    url: jdbc:h2:mem:data_generator_db
    driver-class-name: org.h2.Driver
    username: sa
    password: password


  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# Server Configuration
server:
  port: 8080
